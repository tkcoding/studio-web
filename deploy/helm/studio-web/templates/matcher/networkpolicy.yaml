{{- if and .Values.matcher.enabled .Values.matcher.networkPolicy.enabled }}
{{- /*
  Only the backend may call the matcher: it holds paid keys and runs paid work for whoever holds the
  shared secret, so the secret is not the only thing between it and the rest of the namespace.
  Egress is not restricted here: the matcher must reach the LLM connector and GitHub.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "studio-web.fullname" . }}-gears-matcher
  labels: {{- include "studio-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: gears-matcher
spec:
  podSelector:
    matchLabels: {{- include "studio-web.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gears-matcher
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "studio-web.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: {{ .Values.matcher.port }} }
{{- end }}
