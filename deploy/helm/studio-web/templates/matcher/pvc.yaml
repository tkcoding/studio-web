{{- if .Values.matcher.enabled }}
{{- /*
  The gears-matcher's model-reply cache and its gears-rust checkout. The runs and their idempotency
  keys are in PostgreSQL, not here.

  Kept with the release (helm.sh/resource-policy: keep): the cached replies were paid for, and a run
  that a restart re-queues reads them back instead of paying again. One Pod mounts it
  (ReadWriteOnce), which is why the Deployment is Recreate.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "studio-web.fullname" . }}-gears-matcher
  labels: {{- include "studio-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: gears-matcher
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.matcher.persistence.size | quote }}
  {{- with .Values.matcher.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
