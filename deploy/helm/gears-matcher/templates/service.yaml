{{- /* In-cluster only: the backend calls http://<this name> (port 80). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gears-matcher.fullname" . }}
  labels: {{- include "gears-matcher.labels" . | nindent 4 }}
spec:
  selector: {{- include "gears-matcher.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
