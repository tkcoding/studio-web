[project]
name = "studio-gears-matcher"
version = "0.1.0"
description = "The gears-matcher service: run the verified matcher on a spec by API (T9, HYP-3172)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "httpx2>=2.0.0",
    "pydantic>=2.14.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.32",
]

[project.scripts]
gears-service = "gears_matcher.service.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0",
]

[tool.uv]
required-version = ">=0.12.23"

[tool.uv.build-backend]
module-name = "gears_matcher"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "PT", "RET", "RUF", "C90", "N", "A", "ERA", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # asserts and literal expected values are what tests are made of

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
